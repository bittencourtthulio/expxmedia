<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="506" viewBox="0 0 1000 506" role="img" aria-label="As 16 capacidades do núcleo: 6 funcionam sem chave e 10 ligam com a chave do .env">
  <title>As 16 capacidades do núcleo: 6 funcionam sem chave e 10 ligam com a chave do .env</title>
  <style>
    .fb{transform-box:fill-box;transform-origin:center}
